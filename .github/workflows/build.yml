name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install dependencies
        working-directory: code
        run: npm ci
      - name: Run tests
        working-directory: code
        run: npm test

  package:
    name: package-${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            command: npm run dist:win
          - name: linux
            os: ubuntu-latest
            command: npm run dist:linux
          - name: macos
            os: macos-latest
            command: npm run dist:mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install dependencies
        working-directory: code
        run: npm ci
      - name: Build portable package
        working-directory: code
        run: ${{ matrix.command }}
      - name: Smoke test unpacked Linux app
        if: matrix.name == 'linux'
        working-directory: code
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          rm -rf /tmp/relay-ci-db
          set -o pipefail
          xvfb-run -a env PORT=4190 RELAY_DB=/tmp/relay-ci-db/relay.db RELAY_SMOKE=1 ./release/linux-unpacked/relay --no-sandbox | tee /tmp/relay-smoke.log
          grep SMOKE_OK /tmp/relay-smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.name }}
          path: |
            code/release/*.exe
            code/release/*.AppImage
            code/release/*.tar.gz
            code/release/*.zip
            code/release/*.yml
            code/release/*.blockmap
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          gh release view "$GITHUB_REF_NAME" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" -R "$REPO" --title "接力 Relay $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/* -R "$REPO" --clobber
